# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      # 1人運用で追い切れる頻度に抑える(daily だと PR が滞留する)
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'electron'
        update-types: ['version-update:semver-major']
      - dependency-name: 'electron-store'
        update-types: ['version-update:semver-major']
      - dependency-name: '@electron-forge/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@trpc/*'
        update-types: ['version-update:semver-major']
      # react-query の major は tRPC の peer 依存と絡むため tRPC 更新と合わせて計画的に上げる
      # (tRPC 11 + react-query v5 へは移行済み。次の major も同様の扱い)
      - dependency-name: '@tanstack/react-query'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dot-prop'
        update-types: ['version-update:semver-major']
      - dependency-name: 'matcher'
        update-types: ['version-update:semver-major']
    groups:
      commitizen:
        patterns:
          - 'commitizen'
          - 'cz-conventional-changelog*'
      commitlint:
        patterns:
          - '@commitlint/*'
      electron-forge:
        patterns:
          - '@electron-forge/*'
      eslint:
        patterns:
          - 'eslint*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      prettier:
        patterns:
          - 'prettier*'
      react:
        patterns:
          - '@types/react'
          - '@types/react-dom'
          - 'react'
          - 'react-dom'

  - package-ecosystem: 'bundler'
    directory: '/docs'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2

name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn run lint
      - run: yarn run lint:ts
      - run: yarn test

name: Build
on:
  push:
    branches: [main]
  # base を main に限定しない: 中間ブランチ宛ての PR(stacked PR)にも CI を回すため。
  # branches フィルタは head ではなく base を見るので、限定すると stacked PR が無検証になる。
  pull_request:

# 同一 PR の古い実行は打ち切る。push イベントでは打ち切らない:
# main の各コミットは Actions のステータスとして残す必要があり、
# 短時間に複数マージが来たときに先行分を消してしまうため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 240000

      - name: Build
        run: yarn run make

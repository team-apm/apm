<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
		<!-- Monaco はローカル同梱(main_window/vs)から読むため CDN 許可は無い。
		     worker-src blob: は Monaco の AMD loader が worker を blob 経由で起動するため、
		     style-src 'unsafe-inline' は Monaco と Bootstrap の動的スタイルのために残している -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src-elem 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.nicovideo.jp https://*.nicoseiga.jp https://nicovideo.cdn.nimg.jp"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AviUtl Package Manager</title>
		<meta name="color-scheme" content="light dark" />
	</head>

	<body>
		<nav class="bg-body-tertiary draggable">
			<div
				class="title-bar app-name d-flex justify-content-center align-items-center text-muted"
			></div>
			<div class="nav nav-tabs" id="nav-tab" role="tablist">
				<button
					class="non-draggable nav-link active"
					id="aviutl-tab"
					data-bs-toggle="tab"
					data-bs-target="#aviutl"
					type="button"
					role="tab"
					aria-controls="aviutl"
					aria-selected="true"
				>
					AviUtl
				</button>
				<button
					class="non-draggable nav-link"
					id="packages-tab"
					data-bs-toggle="tab"
					data-bs-target="#packages"
					type="button"
					role="tab"
					aria-controls="packages"
					aria-selected="false"
				>
					プラグイン&スクリプト
				</button>
				<button
					class="non-draggable nav-link"
					id="nicommons-tab"
					data-bs-toggle="tab"
					data-bs-target="#nicommons"
					type="button"
					role="tab"
					aria-controls="nicommons"
					aria-selected="false"
				>
					ニコニ・コモンズID
				</button>
				<button
					class="non-draggable nav-link"
					id="settings-tab"
					data-bs-toggle="tab"
					data-bs-target="#settings"
					type="button"
					role="tab"
					aria-controls="settings"
					aria-selected="false"
				>
					設定
				</button>
				<button
					class="non-draggable nav-link"
					id="others-tab"
					data-bs-toggle="tab"
					data-bs-target="#others"
					type="button"
					role="tab"
					aria-controls="others"
					aria-selected="false"
				>
					その他
				</button>
			</div>
		</nav>

		<main class="tab-content" id="nav-tabContent">
			<!-- 中身は React(aviutl/AviutlTab.tsx)が描画する -->
			<section
				class="tab-pane fade show active"
				id="aviutl"
				role="tabpanel"
				aria-labelledby="aviutl"
			></section>

			<!-- 中身は React(packages/PackagesTab.tsx)が描画する -->
			<section
				class="tab-pane fade"
				id="packages"
				role="tabpanel"
				aria-labelledby="packages"
			></section>

			<section
				class="tab-pane fade"
				id="nicommons"
				role="tabpanel"
				aria-labelledby="nicommons"
			>
				<div class="container-lg">
					<div class="row card border-top-0 border-bottom-0 rounded-0">
						<div class="card-body d-flex flex-column py-2">
							<div class="row pb-2 border-bottom">
								<div class="col-auto">
									<button
										type="button"
										class="btn btn-copy btn-primary"
										id="copy-nicommons-id-textarea"
										data-clipboard-target="#nicommons-id-textarea"
									>
										コピー
									</button>
								</div>
								<div class="col">
									<textarea
										rows="1"
										name="nicommons-id-textarea"
										id="nicommons-id-textarea"
										class="form-control"
										readonly
									></textarea>
								</div>
							</div>
							<div class="row flex-grow-1 overflow-auto">
								<div class="col">
									<ul
										class="list-group list-group-flush"
										id="nicommons-id-list"
									></ul>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="settings"
				role="tabpanel"
				aria-labelledby="settings"
			>
				<div class="container-lg py-2">
					<div class="row my-2">
						<div class="card">
							<div class="card-body">
								<h3 class="card-title">設定</h3>
								<div id="settings-data-url-root"></div>
								<div class="row mb-3">
									<label for="container" class="form-label"
										>追加テキストデータ</label
									>
									<div class="col-sm-9">
										<div id="container" class="border rounded"></div>
									</div>
									<div class="col-sm-3">
										<!-- ボタンは React(monacoEditorRenderer.tsx)が描画する -->
										<div id="save-editor-data-root"></div>
									</div>
								</div>
								<div id="settings-preferences-root"></div>
								<hr />
								<div class="row mb-3">
									<h4>手動更新</h4>
									<div id="manual-update-react-root" class="d-none"></div>
									<table class="table table-borderless table-striped">
										<thead>
											<tr>
												<th scope="col" class="col-sm-3"></th>
												<th scope="col" class="col-sm-3">リスト更新日時</th>
												<th scope="col" class="col-sm-3">最終更新日時</th>
												<th scope="col" class="col-sm-3"></th>
											</tr>
										</thead>
										<!-- 行は React(settings/ManualUpdateTable.tsx)が描画する -->
										<tbody
											class="align-middle"
											id="manual-update-tbody"
										></tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="others"
				role="tabpanel"
				aria-labelledby="others"
			>
				<div id="others-root"></div>
			</section>
		</main>
	</body>
</html>

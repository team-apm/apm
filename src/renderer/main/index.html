<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
		<!-- Monaco はローカル同梱(main_window/vs)から読むため CDN 許可は無い。
		     worker-src blob: は Monaco の AMD loader が worker を blob 経由で起動するため、
		     style-src 'unsafe-inline' は Monaco と Bootstrap の動的スタイルのために残している -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src-elem 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.nicovideo.jp https://*.nicoseiga.jp https://nicovideo.cdn.nimg.jp"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AviUtl Package Manager</title>
		<meta name="color-scheme" content="light dark" />
	</head>

	<body>
		<nav class="bg-body-tertiary draggable">
			<div
				class="title-bar app-name d-flex justify-content-center align-items-center text-muted"
			></div>
			<div class="nav nav-tabs" id="nav-tab" role="tablist">
				<button
					class="non-draggable nav-link active"
					id="aviutl-tab"
					data-bs-toggle="tab"
					data-bs-target="#aviutl"
					type="button"
					role="tab"
					aria-controls="aviutl"
					aria-selected="true"
				>
					AviUtl
				</button>
				<button
					class="non-draggable nav-link"
					id="packages-tab"
					data-bs-toggle="tab"
					data-bs-target="#packages"
					type="button"
					role="tab"
					aria-controls="packages"
					aria-selected="false"
				>
					プラグイン&スクリプト
				</button>
				<button
					class="non-draggable nav-link"
					id="nicommons-tab"
					data-bs-toggle="tab"
					data-bs-target="#nicommons"
					type="button"
					role="tab"
					aria-controls="nicommons"
					aria-selected="false"
				>
					ニコニ・コモンズID
				</button>
				<button
					class="non-draggable nav-link"
					id="settings-tab"
					data-bs-toggle="tab"
					data-bs-target="#settings"
					type="button"
					role="tab"
					aria-controls="settings"
					aria-selected="false"
				>
					設定
				</button>
				<button
					class="non-draggable nav-link"
					id="others-tab"
					data-bs-toggle="tab"
					data-bs-target="#others"
					type="button"
					role="tab"
					aria-controls="others"
					aria-selected="false"
				>
					その他
				</button>
			</div>
		</nav>

		<main class="tab-content" id="nav-tabContent">
			<!-- 中身は React(aviutl/AviutlTab.tsx)が描画する -->
			<section
				class="tab-pane fade show active"
				id="aviutl"
				role="tabpanel"
				aria-labelledby="aviutl"
			></section>

			<!-- 中身は React(packages/PackagesTab.tsx)が描画する -->
			<section
				class="tab-pane fade"
				id="packages"
				role="tabpanel"
				aria-labelledby="packages"
			></section>

			<!-- 中身は React(nicommons/NicommonsTab.tsx)が描画する -->
			<section
				class="tab-pane fade"
				id="nicommons"
				role="tabpanel"
				aria-labelledby="nicommons"
			></section>

			<!-- 中身は React(settings/SettingsTab.tsx)が描画する -->
			<section
				class="tab-pane fade"
				id="settings"
				role="tabpanel"
				aria-labelledby="settings"
			></section>

			<!-- 中身は React(others/OthersTab.tsx)が描画する -->
			<section
				class="tab-pane fade"
				id="others"
				role="tabpanel"
				aria-labelledby="others"
			></section>
		</main>
	</body>
</html>

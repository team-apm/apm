<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
		<!-- TODO(security): cdn.jsdelivr.net / 'unsafe-inline' / blob: は CDN 版 Monaco のための暫定緩和。セキュリティフェーズで Monaco をローカルバンドルに切り替えて回収する -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src-elem 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://*.nicovideo.jp https://*.nicoseiga.jp https://nicovideo.cdn.nimg.jp"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AviUtl Package Manager</title>
		<meta name="color-scheme" content="light dark" />
	</head>

	<body>
		<nav class="bg-body-tertiary draggable">
			<div
				class="title-bar app-name d-flex justify-content-center align-items-center text-muted"
			></div>
			<div class="nav nav-tabs" id="nav-tab" role="tablist">
				<button
					class="non-draggable nav-link active"
					id="aviutl-tab"
					data-bs-toggle="tab"
					data-bs-target="#aviutl"
					type="button"
					role="tab"
					aria-controls="aviutl"
					aria-selected="true"
				>
					AviUtl
				</button>
				<button
					class="non-draggable nav-link"
					id="packages-tab"
					data-bs-toggle="tab"
					data-bs-target="#packages"
					type="button"
					role="tab"
					aria-controls="packages"
					aria-selected="false"
				>
					プラグイン&スクリプト
				</button>
				<button
					class="non-draggable nav-link"
					id="nicommons-tab"
					data-bs-toggle="tab"
					data-bs-target="#nicommons"
					type="button"
					role="tab"
					aria-controls="nicommons"
					aria-selected="false"
				>
					ニコニ・コモンズID
				</button>
				<button
					class="non-draggable nav-link"
					id="settings-tab"
					data-bs-toggle="tab"
					data-bs-target="#settings"
					type="button"
					role="tab"
					aria-controls="settings"
					aria-selected="false"
				>
					設定
				</button>
				<button
					class="non-draggable nav-link"
					id="others-tab"
					data-bs-toggle="tab"
					data-bs-target="#others"
					type="button"
					role="tab"
					aria-controls="others"
					aria-selected="false"
				>
					その他
				</button>
			</div>
		</nav>

		<main class="tab-content" id="nav-tabContent">
			<section
				class="tab-pane fade show active"
				id="aviutl"
				role="tabpanel"
				aria-labelledby="aviutl"
			>
				<div class="container-lg py-2 m-w-800">
					<nav class="navbar navbar-light">
						<div class="container-fluid">
							<span class="navbar-brand">
								<img
									src="../../../icon/apm32.png"
									alt=""
									class="d-inline-block"
									width="20"
									height="20"
								/>
								<span class="ms-1 align-middle">AviUtl Package Manager</span>
							</span>
						</div>
					</nav>
					<div id="tutorial-alert" class="row my-2 d-none">
						<div
							class="my-0 alert alert-info alert-dismissible fade show"
							role="alert"
						>
							apmへようこそ！
							<a
								href="https://team-apm.github.io/apm/#apm%E3%81%AE%E3%83%81%E3%83%A5%E3%83%BC%E3%83%88%E3%83%AA%E3%82%A2%E3%83%AB"
								class="alert-link"
							>
								チュートリアル</a
							>
							から使い方を確認できます。
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="alert"
								aria-label="Close"
							></button>
						</div>
					</div>
					<div class="row my-2 card">
						<div class="card-body">
							<div class="mb-3 d-flex">
								<div
									class="flex-grow-1 border rounded-start d-flex align-items-center ps-3"
									id="addon-wrapping"
								>
									<i class="bi bi-folder2 me-3"></i>
									<input
										class="form-control-plaintext"
										id="installation-path"
										type="text"
										placeholder="AviUtlフォルダ"
										aria-label="Installation path"
										readonly
									/>
								</div>
								<button
									type="button"
									class="btn btn-primary rounded-0 rounded-end"
									id="select-installation-path"
								>
									AviUtlインストールフォルダを選択
								</button>
							</div>
							<ul class="list-group mb-3" id="batch-install-packages">
								<!-- 中身は React(ProgramRow)が描画する -->
								<li
									class="list-group-item py-0 pe-0 d-flex"
									id="aviutl-program-root"
								></li>
								<li
									class="list-group-item py-0 pe-0 d-flex"
									id="exedit-program-root"
								></li>
							</ul>
							<div class="d-none">
								<li
									id="batch-install-package-template"
									class="list-group-item py-0 d-flex py-2 batch-install-package"
								>
									<div class="d-flex align-items-center flex-grow-1">
										<i class="bi bi-box-seam me-3"></i>
										<div class="name"></div>
									</div>
									<div>
										<span class="installed-version"></span>
									</div>
								</li>
							</div>
							<div class="d-flex justify-content-end">
								<button
									type="button"
									class="btn btn-primary"
									id="batch-install"
								>
									AviUtl・拡張編集とおすすめプラグインのインストール
								</button>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="packages"
				role="tabpanel"
				aria-labelledby="packages"
			>
				<div class="container-lg">
					<div class="row card border-top-0 border-bottom-0 rounded-0">
						<div class="card-body py-2">
							<div class="d-flex flex-column h-100">
								<div class="flex-shrink-1">
									<div class="d-flex mb-2">
										<div class="border rounded flex-grow-1 w-auto d-flex">
											<input
												class="form-control border-0 flex-grow-1 w-auto fuzzy-search-wrapped"
												placeholder="🔍︎ 検索  |  共有貼り付け"
												aria-label="検索 / 共有"
												size="2"
											/>
											<div class="d-flex" id="packages-sort"></div>
										</div>
										<button
											type="button"
											class="btn btn-primary ms-2"
											id="install-package"
										>
											インストール
										</button>
										<button
											type="button"
											class="btn btn-primary ms-2"
											id="uninstall-package"
										>
											アンインストール
										</button>
										<button
											type="button"
											class="btn btn-primary ms-2"
											id="open-package-folder"
										>
											ダウンロードフォルダ
										</button>
										<button
											type="button"
											class="btn btn-primary ms-2"
											id="share-packages"
										>
											共有
										</button>
									</div>
								</div>
								<div class="h-100 min-h-0">
									<div class="row h-100">
										<div
											class="col-sm-auto overflow-x-hidden overflow-y-auto h-100"
										>
											<ul
												id="filter"
												class="list-unstyled dropdown-menu d-block position-static border-0"
												aria-labelledby="type-filter"
											>
												<li>
													<button
														class="dropdown-item install-filter px-0"
														type="button"
														data-install-filter="clear"
													>
														<i class="bi bi-check me-1"></i
														><i class="bi bi-box-seam me-1"></i>パッケージ
													</button>
													<ul class="list-unstyled ps-3" aria-labelledby="">
														<li>
															<button
																class="dropdown-item install-filter px-0"
																type="button"
																data-install-filter="true"
															>
																<i class="bi bi-check"></i>インストール済み
															</button>
														</li>
														<li>
															<button
																class="dropdown-item install-filter px-0"
																type="button"
																data-install-filter="manual"
															>
																<i class="bi bi-check"></i>手動インストール済み
															</button>
														</li>
														<li>
															<button
																class="dropdown-item install-filter px-0"
																type="button"
																data-install-filter="false"
															>
																<i class="bi bi-check"></i>未インストール
															</button>
														</li>
													</ul>
												</li>
												<li>
													<hr class="mx-2 dropdown-divider" />
													探す
												</li>
												<li>
													<button
														class="dropdown-item type-filter px-0"
														type="button"
														data-type-filter="plugin"
													>
														<i class="bi bi-check me-1"></i
														><i class="bi bi-film me-1"></i>プラグイン
													</button>
													<ul class="list-unstyled ps-3" aria-labelledby="">
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="input"
															>
																<i class="bi bi-check"></i>入力
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="output"
															>
																<i class="bi bi-check"></i>出力
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="filter"
															>
																<i class="bi bi-check"></i>フィルター
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="color"
															>
																<i class="bi bi-check"></i>色変換
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="language"
															>
																<i class="bi bi-check"></i>言語
															</button>
														</li>
													</ul>
												</li>
												<li>
													<button
														class="dropdown-item type-filter px-0"
														type="button"
														data-type-filter="script"
													>
														<i class="bi bi-check me-1"></i
														><i class="bi bi-calendar3-range me-1"></i
														>スクリプト
													</button>
													<ul class="list-unstyled ps-3" aria-labelledby="">
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="animation"
															>
																<i class="bi bi-check"></i>アニメーション効果
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="object"
															>
																<i class="bi bi-check"></i>カスタムオブジェクト
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="scene"
															>
																<i class="bi bi-check"></i>シーンチェンジ
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="camera"
															>
																<i class="bi bi-check"></i>カメラ制御
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="track"
															>
																<i class="bi bi-check"></i>トラックバー
															</button>
														</li>
														<li>
															<button
																class="dropdown-item type-filter px-0"
																type="button"
																data-type-filter="script-dist"
															>
																<i class="bi bi-check"></i>配布サイトから探す
															</button>
														</li>
													</ul>
												</li>

												<li>
													<a
														href="https://team-apm.github.io/apm/#%E3%83%97%E3%83%A9%E3%82%B0%E3%82%A4%E3%83%B3%E3%82%B9%E3%82%AF%E3%83%AA%E3%83%97%E3%83%88%E3%81%A8%E3%81%AF"
														class="dropdown-item pe-0"
														type="button"
													>
														<i class="bi bi-info-circle me-1"></i>これは何？<i
															class="bi bi-box-arrow-up-right ms-1"
														></i>
													</a>
												</li>
												<li>
													<hr class="mx-2 dropdown-divider" />
													作る
												</li>
												<li>
													<a
														href="https://docs.google.com/forms/d/e/1FAIpQLSf0N-X_u_abi8rrWHVDdiK3YeYuQ7J1f8bQAy6QTD-OR94DWQ/viewform?usp=sf_link"
														class="dropdown-item pe-0"
														type="button"
													>
														<i class="bi bi-megaphone me-1"></i>提案する<i
															class="bi bi-box-arrow-up-right ms-1"
														></i>
													</a>
												</li>
												<li>
													<a
														href="https://team-apm.github.io/apm-web/"
														class="dropdown-item pe-0"
														type="button"
													>
														<i class="bi bi-pencil me-1"></i>作ってみる<i
															class="bi bi-box-arrow-up-right ms-1"
														></i>
													</a>
												</li>
											</ul>
										</div>
										<div class="col d-flex flex-column h-100">
											<div id="packages-react-root" class="d-none"></div>
											<div id="custom-search-alert"></div>
											<div class="row flex-grow-1 overflow-auto">
												<div class="col" id="packages-table">
													<ul
														class="list list-group list-group-flush"
														id="packages-list"
													></ul>
													<ul
														class="list-group list-group-flush"
														id="packages-list2"
													></ul>
												</div>
												<div
													class="d-flex justify-content-center align-items-center fade"
													id="packages-table-overlay"
												>
													<div class="spinner-border" role="status">
														<span class="visually-hidden">Loading...</span>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="nicommons"
				role="tabpanel"
				aria-labelledby="nicommons"
			>
				<div class="container-lg">
					<div class="row card border-top-0 border-bottom-0 rounded-0">
						<div class="card-body d-flex flex-column py-2">
							<div class="row pb-2 border-bottom">
								<div class="col-auto">
									<button
										type="button"
										class="btn btn-copy btn-primary"
										id="copy-nicommons-id-textarea"
										data-clipboard-target="#nicommons-id-textarea"
									>
										コピー
									</button>
								</div>
								<div class="col">
									<textarea
										rows="1"
										name="nicommons-id-textarea"
										id="nicommons-id-textarea"
										class="form-control"
										readonly
									></textarea>
								</div>
							</div>
							<div class="row flex-grow-1 overflow-auto">
								<div class="col">
									<ul
										class="list-group list-group-flush"
										id="nicommons-id-list"
									></ul>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="settings"
				role="tabpanel"
				aria-labelledby="settings"
			>
				<div class="container-lg py-2">
					<div class="row my-2">
						<div class="card">
							<div class="card-body">
								<h3 class="card-title">設定</h3>
								<div id="settings-data-url-root"></div>
								<div class="row mb-3">
									<label for="container" class="form-label"
										>追加テキストデータ</label
									>
									<div class="col-sm-9">
										<div id="container" class="border rounded"></div>
									</div>
									<div class="col-sm-3">
										<button
											type="button"
											class="btn btn-primary w-100"
											id="save-editor-data"
										>
											保存 (Ctrl + S)
										</button>
									</div>
								</div>
								<div id="settings-preferences-root"></div>
								<hr />
								<div class="row mb-3">
									<h4>手動更新</h4>
									<table class="table table-borderless table-striped">
										<thead>
											<tr>
												<th scope="col" class="col-sm-3"></th>
												<th scope="col" class="col-sm-3">リスト更新日時</th>
												<th scope="col" class="col-sm-3">最終更新日時</th>
												<th scope="col" class="col-sm-3"></th>
											</tr>
										</thead>
										<tbody class="align-middle">
											<tr>
												<th scope="row">AviUtl・拡張編集データ</th>
												<td><span id="core-mod-date"></span></td>
												<td><span id="core-check-date"></span></td>
												<td>
													<div class="bg-body">
														<button
															type="button"
															class="btn btn-primary w-100"
															id="check-core-version"
														>
															更新
														</button>
													</div>
												</td>
											</tr>
											<tr>
												<th scope="row">パッケージデータ</th>
												<td><span id="packages-mod-date"></span></td>
												<td><span id="packages-check-date"></span></td>
												<td>
													<div class="bg-body">
														<button
															type="button"
															class="btn btn-primary w-100"
															id="check-packages-list"
														>
															更新
														</button>
													</div>
												</td>
											</tr>
											<tr>
												<th scope="row">apm</th>
												<td>-</td>
												<td>-</td>
												<td>
													<div class="bg-body">
														<button
															type="button"
															class="btn btn-primary w-100"
															id="check-apm-update"
														>
															更新
														</button>
													</div>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>

			<section
				class="tab-pane fade"
				id="others"
				role="tabpanel"
				aria-labelledby="others"
			>
				<div id="others-root"></div>
			</section>
		</main>
	</body>
</html>
